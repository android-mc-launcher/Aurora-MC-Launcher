# ---- Gradle 9.9.1 / JDK 25 ----
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- AGP 9.5.1 新版 DSL（默认即为 true，此处显式声明以固定行为）----
android.newDsl=true
android.builtInKotlin=true

# ---- JDK 25 精确配置 ----
# 方式一（推荐）：Android Studio Rabbit 2 Patch 1 → Settings → Build Tools → Gradle → Gradle JDK
#                = OpenJDK 25.0.5 GA（或 25.0.5.1 带外 GA / Temurin 25）
# 方式二：取消下行注释并填入本机 JDK 25 绝对路径
# org.gradle.java.home=/path/to/jdk-25.0.5
# 注：Android 侧字节码目标仍为 JVM 21（D8/R8 兼容），JDK 25 用于 Gradle/javac/Kotlin 编译器运行时。
